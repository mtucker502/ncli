defaults:
  username: netscreen
  timeout: 60
  port: 22

groups:
  firewalls:
    - bcd-fw-den-ssl

devices:
  bcd-fw-den-ssl:
    host: bcd-fw-den-ssl
    device_type: cisco_asa
    disabled_algorithms:
      pubkeys:
        - rsa-sha2-512
        - rsa-sha2-256
    auth:
      type: ssh_key
      key_file: ~/.ssh/id_rsa
    tags:
      - role:firewall
      - site:den
