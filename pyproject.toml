[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ncli"
version = "0.1.0"
description = "Multi-vendor network device CLI tool using Netmiko"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "click>=8.1.0",
    "netmiko>=4.3.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
textfsm = ["ntc-templates>=6.0.0"]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.14.0",
]

[project.scripts]
ncli = "ncli.cli.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
